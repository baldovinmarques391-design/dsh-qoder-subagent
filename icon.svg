  <rect x="8.87109" y="9.0697" width="12.2365" height="12.2365" rx="2" fill="url(#sa-b)" fill-opacity="0.8"/>
  <defs>
    <linearGradient id="sa-a" x1="21.1075" y1="15.1877" x2="21.1075" y2="27.4243" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45E7A4"/>
      <stop offset="1" stop-color="#05909D"/>
